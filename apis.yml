name: Autotacbio

description: 'Autotacbio (AUTOTAC Bio) is a biotechnology company developing first‑in‑class therapeutics based on its proprietary AUTOTAC (Autophagy‑Targeting Chimera) platform. The company focuses on targeted protein degradation to treat neurodegenerative diseases, cancer, metabolic disorders, and other conditions by directing disease‑causing proteins to autophagy for lysosomal clearance. It operates from Seoul, Korea, and aims to become a global pharmaceutical leader.'

